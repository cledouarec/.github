name: Contribution snake

on:
  schedule:
    - cron: "42 0 * * *" # every day at 00:42 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    name: Generate the snake SVGs on the output branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Colors match the README: snake in GitHub's syntax "keyword" color, dots on GitHub's
      # blue scale; the empty cell of the dark variant is the code block background.
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#cf222e&color_dots=#eff2f5,#b6e3ff,#54aeff,#0969da,#0550ae
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff7b72&color_dots=#151b23,#0c2d6b,#1158c7,#388bfd,#79c0ff
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
